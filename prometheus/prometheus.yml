global:
  scrape_interval: 30s
  evaluation_interval: 1m

# Anomaly detection: tagging rules + grafana/promql-anomaly-detection
rule_files:
  - /etc/prometheus/rules/*.yml

# Almost everything arrives via remote-write from the OTel collector.
# These scrape the stack itself so we notice if the pipeline breaks.
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
