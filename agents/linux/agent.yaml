# Linux agent (runs as a container). Env:
#   GATEWAY_ENDPOINT  host:4317 of the gateway collector
#   HOST_ROOT_PATH    /hostfs when containerised (default /)
receivers:
  hostmetrics:
    collection_interval: 30s
    root_path: ${env:HOST_ROOT_PATH:-/}
    scrapers:
      cpu:
        metrics: { system.cpu.utilization: { enabled: true } }
      memory:
        metrics: { system.memory.utilization: { enabled: true } }
      load: {}
      network: {}
      disk: {}
      filesystem:
        metrics: { system.filesystem.utilization: { enabled: true } }
        exclude_mount_points:
          mount_points: [/dev/*, /proc/*, /sys/*, /run/*, /var/lib/docker/*, /snap/*]
          match_type: regexp

  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s

  # Container stdout/stderr via docker's json-file driver
  filelog/docker:
    include: [/var/lib/docker/containers/*/*-json.log]
    exclude: [/var/lib/docker/containers/*/*-json.log.*]
    include_file_path: true
    start_at: end
    operators:
      - type: json_parser
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout: "%Y-%m-%dT%H:%M:%S.%LZ"
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '/containers/(?P<container_id>[a-f0-9]{12})'
        on_error: send
      # Compose service name is present if docker's daemon.json sets
      # log-opts.labels-regex (see README); otherwise falls back to container id.
      - type: move
        if: 'attributes.attrs != nil and attributes.attrs["com.docker.compose.service"] != nil'
        from: attributes.attrs["com.docker.compose.service"]
        to: resource["service.name"]
      - type: move
        if: 'resource["service.name"] == nil'
        from: attributes.container_id
        to: resource["service.name"]
      - type: severity_parser
        if: 'attributes.stream == "stderr"'
        parse_from: attributes.stream
        mapping: { error: stderr }
      - type: move
        from: attributes.log
        to: body
      - type: remove
        field: attributes.attrs
        if: 'attributes.attrs != nil'
      - type: remove
        field: attributes.time

processors:
  memory_limiter: { check_interval: 5s, limit_mib: 256 }
  resourcedetection:
    detectors: [env, system]
    system: { hostname_sources: [os] }
  batch: { timeout: 5s }

exporters:
  otlp:
    endpoint: ${env:GATEWAY_ENDPOINT}
    tls: { insecure: true }
    retry_on_failure: { enabled: true, max_elapsed_time: 0 } # keep retrying while gateway is down
    sending_queue: { enabled: true, queue_size: 5000 }

service:
  pipelines:
    metrics:
      receivers: [hostmetrics, docker_stats]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp]
    logs:
      receivers: [filelog/docker]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp]
